name: Python Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check all scripts compile
        run: python -m py_compile hangman.py portfolio.py organizer.py chatbot.py
      - name: Test chatbot
        run: printf 'hello\nwhat are your hours\nbye\n' | python chatbot.py

